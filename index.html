<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple local notes app" />
    <title>Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Your space</p>
          <h1>Notes</h1>
          <p class="intro">Keep the thoughts worth holding on to.</p>
        </div>
        <button id="new-note" class="button button-secondary" type="button">New note</button>
      </header>

      <div class="workspace">
        <section class="editor-panel" aria-labelledby="editor-heading">
          <h2 id="editor-heading">New note</h2>
          <form id="note-form" novalidate>
            <div class="field">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" autocomplete="off" />
              <p id="title-error" class="error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label for="body">Body</label>
              <textarea id="body" name="body" rows="8"></textarea>
              <p id="body-error" class="error" aria-live="polite"></p>
            </div>

            <button class="button button-primary" type="submit">Save</button>
          </form>
        </section>

        <section class="notes-panel" aria-labelledby="notes-heading">
          <div class="section-heading">
            <h2 id="notes-heading">Saved notes</h2>
            <span id="note-count" class="note-count" aria-live="polite"></span>
          </div>
          <p id="empty-state" class="empty-state">No notes yet. Write your first one.</p>
          <div id="notes-list" class="notes-list"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
